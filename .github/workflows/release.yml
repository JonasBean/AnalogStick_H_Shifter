name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build (Release)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Configuration Release

      - name: Package (zip, without PDBs)
        shell: powershell
        run: |
          $out = 'AnalogStick_H_Shifter\bin\Release'
          $zip = "analogstick-h-shifter-${{ github.ref_name }}.zip"
          $files = Get-ChildItem -Path $out -File | Where-Object { $_.Extension -ne '.pdb' }
          if (-not $files) { Write-Error "No files found to zip in $out"; exit 1 }
          Compress-Archive -LiteralPath $files.FullName -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'Release build for ${{ github.ref_name }}. Download the ZIP file, extract it and start AnalogStick_H_Shifter.exe. Requires .NET Framework 4.7.2 or newer.'
          gh release create '${{ github.ref_name }}' $env:ZIP --title '${{ github.ref_name }}' --notes $notes
